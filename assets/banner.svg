<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .neon-pulse {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .stream-fast {
      stroke-dasharray: 120 180;
      animation: dashMove 6s linear infinite;
    }
    .stream-slow {
      stroke-dasharray: 80 220;
      animation: dashMove 9s linear infinite;
    }
    .pill-glow {
      transition: all 0.3s ease;
    }
    .float-card {
      animation: floatMotion 5s ease-in-out infinite alternate;
    }
    .glow-sphere {
      animation: orbGlow 7s ease-in-out infinite alternate;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 600; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0% { opacity: 0.25; transform: scale(0.98); }
      100% { opacity: 0.55; transform: scale(1.02); }
    }
    @keyframes floatMotion {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes orbGlow {
      0% { opacity: 0.3; transform: translate(0, 0) scale(1); }
      50% { opacity: 0.6; transform: translate(30px, -20px) scale(1.15); }
      100% { opacity: 0.3; transform: translate(-20px, 15px) scale(0.95); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Glow Spheres -->
  <circle class="glow-sphere" cx="200" cy="90" r="140" fill="#38bdf8" opacity="0.18" filter="url(#glow)" />
  <circle class="glow-sphere" cx="1020" cy="240" r="150" fill="#818cf8" opacity="0.18" filter="url(#glow)" />
  <circle class="glow-sphere" cx="600" cy="320" r="120" fill="#c084fc" opacity="0.12" filter="url(#glow)" />

  <!-- Grid Pattern Overlay -->
  <g>
    <line x1="100" y1="0" x2="100" y2="360" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="360" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="360" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="360" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="360" class="grid-line" />

    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
  </g>

  <!-- Flowing Dynamic Transfer Stream Lines -->
  <path d="M -50 90 Q 280 20, 600 90 T 1250 80" fill="none" stroke="url(#accentCyan)" stroke-width="2.5" class="stream-fast" opacity="0.65" filter="url(#softGlow)" />
  <path d="M -50 280 Q 320 340, 650 280 T 1250 290" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" class="stream-slow" opacity="0.6" filter="url(#softGlow)" />
  <path d="M 100 320 C 400 320, 800 40, 1150 40" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.5" stroke-dasharray="10 15" opacity="0.35" />

  <!-- Left Accent Tech Element (Speed Graph & Indicators) -->
  <g class="float-card" transform="translate(60, 115)">
    <rect width="130" height="95" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5" />
    <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">MULTI-THREAD</text>
    <line x1="15" y1="42" x2="115" y2="42" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="54" x2="95" y2="54" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="66" x2="105" y2="66" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="78" x2="70" y2="78" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <text x="75" y="81" font-family="monospace" font-size="9" fill="#10b981">16x CHUNKS</text>
  </g>

  <!-- Right Accent Tech Element (Active Protocol Engine) -->
  <g class="float-card" transform="translate(1010, 115)">
    <rect width="130" height="95" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="28" cy="28" r="6" fill="#10b981" />
    <text x="42" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">ENGINE ACTIVE</text>
    <text x="15" y="58" font-family="monospace" font-size="11" fill="#38bdf8">⚡ 940 Mbps</text>
    <text x="15" y="76" font-family="monospace" font-size="10" fill="#94a3b8">P2P + HTTP/3</text>
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Badges) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 58)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5" text-anchor="middle">AWESOME DESKTOP UTILITIES</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    Download Manager Ecosystem
  </text>

  <!-- Gradient Subtitle -->
  <text x="600" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="0.2">
    High-Speed Accelerators • Multi-Thread Engines • BitTorrent &amp; CLI Tools
  </text>

  <!-- Explanatory Tagline -->
  <text x="600" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    Curated SaaS Platforms, Commercial Powerhouses &amp; Top Open-Source Repositories
  </text>

  <!-- Dynamic Feature Badges / Pills in Foreground -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: Multi-Protocol -->
    <g transform="translate(-320, 0)">
      <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">🚀 Multi-Protocol</text>
    </g>

    <!-- Pill 2: BitTorrent & Magnet -->
    <g transform="translate(-160, 0)">
      <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">🧲 BitTorrent &amp; P2P</text>
    </g>

    <!-- Pill 3: Segmented Speed -->
    <g transform="translate(10, 0)">
      <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">⚡ 16x Acceleration</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(180, 0)">
      <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">🔓 100% Open Source</text>
    </g>

    <!-- Pill 5: Cross-Platform -->
    <g transform="translate(330, 0)">
      <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">💻 Cross-Platform</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
